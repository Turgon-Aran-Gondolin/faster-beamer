name: CI and release

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --verbose --all

      - name: Test
        run: cargo test --locked --verbose --all

  validate-release:
    name: Validate release tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Match tag to Cargo package version
        shell: bash
        run: |
          package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          expected_tag="v${package_version}"

          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo package version ${package_version}. Expected ${expected_tag}."
            exit 1
          fi

          if [[ "${package_version}" == *-* ]]; then
            echo "::error::Refusing to publish prerelease package version ${package_version}; the binary version embeds a commit hash."
            exit 1
          fi

  build-release-binaries:
    name: Build release binary (${{ matrix.target }})
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-and-test
      - validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Smoke-test Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: target/${{ matrix.target }}/release/faster-beamer --version

      - name: Smoke-test Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "target/${{ matrix.target }}/release/faster-beamer.exe" --version'

      - name: Package Linux binary
        if: runner.os == 'Linux'
        id: package-linux
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          asset="faster-beamer-${RELEASE_TAG}-${TARGET}"
          mkdir "${asset}"
          cp "target/${TARGET}/release/faster-beamer" "${asset}/"
          cp README.md LICENCE.md "${asset}/"
          tar -czf "${asset}.tar.gz" "${asset}"
          echo "asset=${asset}.tar.gz" >> "${GITHUB_OUTPUT}"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        id: package-windows
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          $asset = "faster-beamer-$env:RELEASE_TAG-$env:TARGET"
          New-Item -ItemType Directory -Path $asset | Out-Null
          Copy-Item "target/$env:TARGET/release/faster-beamer.exe" $asset
          Copy-Item README.md, LICENCE.md $asset
          Compress-Archive -Path $asset -DestinationPath "$asset.zip"
          "asset=$asset.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ steps.package-linux.outputs.asset || steps.package-windows.outputs.asset }}
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-release-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --generate-notes \
              --title "${GITHUB_REF_NAME}" \
              --verify-tag
          fi
